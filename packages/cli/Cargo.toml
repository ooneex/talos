[package]
name = "cli"
version = "0.0.1"
edition = "2024"

[lib]
name = "cli"
path = "src/lib.rs"

[[bin]]
name = "talos"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
console = "0.16"
dialoguer = "0.12.0"
fs_extra = "1.3.0"
tempfile = "3.27.0"
regex = "1.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = "0.4"
blake3 = { version = "1.5", features = ["mmap", "rayon"] }
num_cpus = "1.17"
ureq = { version = "3.3", features = ["json"] }
flate2 = "1.1"
tar = "0.4"
git2 = "0.21"
base64 = "0.23"
rayon = "1.12.0"
dashmap = { version = "6.2.1", features = ["serde"] }
nanoid = "0.4"
