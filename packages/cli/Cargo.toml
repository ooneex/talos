[package]
name = "talos-cli"
version = "0.14.0"
edition = "2024"
description = "The talos dev CLI — scaffolds projects, modules, and artifacts"
license = "MIT"
repository = "https://github.com/ooneex/talos"
keywords = ["talos", "cli", "scaffold", "codegen"]
publish = false

[lib]
name = "cli"
path = "src/lib.rs"

[[bin]]
name = "talos"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
console = "0.16"
dialoguer = "0.12.0"
fs_extra = "1.3.0"
tempfile = "3.27.0"
regex = "1.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = "0.4"
blake3 = { version = "1.5", features = ["mmap", "rayon"] }
ureq = { version = "3.3", features = ["json", "platform-verifier"] }
flate2 = "1.1"
tar = "0.4"
git2 = "0.21"
rayon = "1.12.0"
dashmap = { version = "6.2.1", features = ["serde"] }
nanoid = "0.4"
portable-pty = "0.9.0"
sha2 = "0.10"
hmac = "0.12"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
filetime = "0.2"

# Every file under tests/ is its own binary that statically links the whole lib,
# so debug info is written and linked 145 times over for a one-line source edit.
# Dropping it is the single cheapest win here; assertion failures still report
# file and line (that comes from #[track_caller], not DWARF). Only symbolicated
# backtraces lose line numbers — set `debug = 1` again when you need to run lldb.
[profile.dev]
debug = 0

[profile.dev.build-override]
debug = 0
