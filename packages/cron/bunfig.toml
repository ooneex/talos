[test]
coverage = true
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "../**",
  "dist/**",
]
# Thresholds are enforced per file, so they are pinned to the least-covered file.
coverageThreshold = { lines = 0.9, functions = 0.6, statements = 0.9 }
